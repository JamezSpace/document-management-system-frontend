<main class="system-error nexus-sans-font" role="alert" aria-live="assertive">
  <div class="system-error__card">
    <span class="system-error__icon" aria-hidden="true">
      <ng-icon name="lucideTriangleAlert" size="2rem" />
    </span>
    <p class="system-error__eyebrow">Secure environment unavailable</p>
    <h1>{{ error()?.title || 'We could not finish setting up your office' }}</h1>
    <p>
      {{ error()?.message || 'Your Firebase session was accepted, but your staff identity could not be loaded from the database.' }}
    </p>
    @if (error()?.requestId) {
      <small>Reference: {{ error()?.requestId }}</small>
    }
    <button type="button" (click)="retry()">
      <ng-icon name="lucideRefreshCw" />
      Retry office setup
    </button>
  </div>
</main>
