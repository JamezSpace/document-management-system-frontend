<div
  hlmEmpty
  class="empty-state"
  [class.empty-state--compact]="state().compact"
  [attr.data-kind]="state().kind"
  role="status"
  aria-live="polite"
>
  <div hlmEmptyHeader>
    <div hlmEmptyMedia variant="icon" class="empty-state__media" aria-hidden="true">
      <ng-icon [name]="state().iconName" size="1.5rem" />
    </div>
    <h3 hlmEmptyTitle>{{ state().title }}</h3>
    <p hlmEmptyDescription>{{ state().description }}</p>
  </div>
  @if (state().actions?.length) {
    <div hlmEmptyContent class="empty-state__actions">
      @for (action of state().actions; track action.id) {
        @if (action.route) {
          <a
            [routerLink]="action.route"
            [queryParams]="action.queryParams"
            class="empty-state__action"
            [attr.data-appearance]="action.appearance ?? 'secondary'"
          >{{ action.label }}</a>
        } @else {
          <button
            type="button"
            class="empty-state__action"
            [attr.data-appearance]="action.appearance ?? 'secondary'"
            (click)="selectAction(action.id)"
          >{{ action.label }}</button>
        }
      }
    </div>
  }
</div>
