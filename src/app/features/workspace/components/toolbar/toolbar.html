<!-- workspace top bar -->
<section class="flex-center justify-between px-2.5 py-2 top-bar">
  <div id="left-section" class="flex-center gap-4">
    <button
      type="button"
      class="p-1 border flex-center justify-center rounded-xs toolbar-btn"
      (click)="exitWorkspace()"
    >
      <ng-icon name="lucideArrowLeft" hlm size="sm" />
    </button>

    <article class="flex-center gap-2">
      <ng-icon name="lucideFile" hlm size="base" />

      <div class="">
        <p class="text-sidebar-background text-xs">
          {{ ui().document?.referenceNumber?.toLowerCase() }}
        </p>
        <p class="font-medium capitalize">
          {{ ui().document?.title }}
        </p>
      </div>
    </article>
  </div>

  <div id="right-section" class="flex-center gap-3.5">
    @if (ui().permissions.readonly) {
      @if (!isMinuting) {
        <button
          type="button"
          class="nexus-button scale-90 secondary"
          (click)="addMinuteToCorrespondence()"
        >
          @if (getStaffMinuteIfExistsBefore().existsBefore) {
            Re-minute
          } @else {
            acknowledge
          }
        </button>
      } @else if (isForwarding) {
        <button
          type="button"
          class="nexus-button scale-90"
          [disabled]="!forwardCorrespondenceFormGroup.controls.forwardToDesignationId.valid"
          [hlmAlertDialogTriggerFor]="forwardDocumentDialog"
        >
          <span class="flex-center gap-x-1.5">
            <ng-icon name="lucideSend" />
            forward</span
          >
        </button>
      }

      <button
        type="button"
        class="nexus-button flex-center gap-2 scale-90 capitalize"
        (click)="printCorrespondence()"
      >
        <ng-icon name="lucidePrinter" />
        print correspondence
      </button>
    } @else {
      <button type="button" class="nexus-button secondary scale-90" (click)="previewDocument()">
        preview
      </button>
      <!-- @if (!ui().isChangesSaved()) {
        <button
          type="button"
          class="nexus-button flex-center gap-2.5 scale-90"
          (click)="saveDocument()"
        >
          @if (!saveDocumentLoading()) {
            <span>Save</span>
          } @else {
            <hlm-spinner class="text-base md:text-lg" />
          }
        </button>
      } @else {
        @if (permissions().canAdvance) {
          <button
            type="button"
            class="nexus-button flex-center gap-1.5 scale-90"
            [hlmAlertDialogTriggerFor]="submitDocumentDialog"
          >
            <ng-icon name="lucideSend" />
            Advance for Approval
          </button>
        } @else if (permissions().canDispatch) {
          <button
            type="button"
            class="nexus-button flex-center gap-1.5 scale-90 capitalize"
            [hlmAlertDialogTriggerFor]="submitDocumentDialog"
          >
            <ng-icon name="lucideSend" />
            Send correspondence
          </button>
        }
      } -->

      @if (ui().primaryAction; as action) {
        <button
          type="button"
          class="nexus-button flex-center gap-2 scale-90"
          (click)="performPrimaryAction(action.action)"
        >
          @if (action.icon) {
            <ng-icon [name]="action.icon" />
          }

          {{ action.label }}
        </button>
      }
      <!-- @if (permissions().canExport) {
        <button
          type="button"
          class="nexus-button flex-center gap-2 scale-90 capitalize"
          (click)="printCorrespondence()"
        >
          <ng-icon name="lucidePrinter" />
          print correspondence
        </button>
      } -->
    }
  </div>
</section>
